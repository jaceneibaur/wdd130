<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table class="cinereousTable">
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>James O. Fantone</td>
              <td>The Battle is the Lord's</td>
              <td>BYU-Idaho</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>Rob Garrett</td>
              <td>He Will Make More of You</td>
              <td>BYU-Idaho</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>David A. and Susan K. Bednar</td>
              <td>BYU-Idaho 25th Anniversary Devotional</td>
              <td>BYU-Idaho</td>
              <td>2026</td>
            </tr>
          </tbody>
        </table>
        <form>
          <label for="fname">First Name:</label><br>
          <input type="text" id="fname" name="fname"><br>
          <label for="lname">Last Name:</label><br>
          <input type="text" id="lname" name="lname"><br>
          <label for="favspeak">Who Was Your Favorite Speaker</label><br>
          <input type="text" id="favspeak" name="favspeak"><br>
          <input type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>

</html>
