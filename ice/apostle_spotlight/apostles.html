<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background: #e8eced;
            color: #fff;

        }

        #wrapper {
            background: url("images/christus.webp");
            border: 5px solid #000;
            width: 777px;
            height: 600px;
            margin: 0 auto;
            border-radius: 20px;
            background-size: cover;
            background-position-x: -178px;
            text-align: center;
        }

        .pres {
            width: 110px;
            height: 110px;
            border: 5px solid #fff;
            border-radius: 50%;
        }

        .firstp {
            width: 90px;
            height: 90px;
            border: 5px solid #fff;
            border-radius: 50%;
        }

        .quorum {
            width: 90px;
            height: 90px;
            border: #fff 5px solid;
            border-radius: 50%;
        }

        .twelve {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            justify-items: center;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <section class="big3">
            <h1>First Presidency</h1>
            <img class="firstp" src="images/eyring.webp" alt="Henry B. Eyring">
            <img class="pres" src="images/oaks.webp" alt="Dalin H. Oaks">
            <img class="firstp" src="images/christofferson.webp" alt="D. Todd Christofferson">
        </section>
        <h3>Quorum of the Twelve Apostles</h3>
        <section class="twelve">
            <img class="quorum" src="images/anderson.webp">
            <img class="quorum" src="images/bednar.webp">
            <img class="quorum" src="images/causse.webp">
            <img class="quorum" src="images/cook.webp">
            <img class="quorum" src="images/gilbert.webp">
            <img class="quorum" src="images/gong.webp">
            <img class="quorum" src="images/kearon.webp">
            <img class="quorum" src="images/rasband.webp">
            <img class="quorum" src="images/renlund.webp">
            <img class="quorum" src="images/soares.webp">
            <img class="quorum" src="images/stevenson.webp">
            <img class="quorum" src="images/uchtdorf.webp">
        </section>
    </div>
</body>

</html>
